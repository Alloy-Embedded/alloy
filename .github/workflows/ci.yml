name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NORTH_STAR guards (no silicon facts in hand-written code, no ifdefs in examples)
        run: ./scripts/check_contract.sh

  # Host unit tests for the portable layers (Tier-1 utilities/services). The
  # SAME suite that can run on silicon, run natively with ASan+UBSan — the
  # -fno-exceptions/-fno-rtti build proves the code compiles as firmware does.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build + run host unit tests
        working-directory: alloy
        run: uv run --project tools/alloy alloy test

  # Unit tests for the host-side Python: the CLI codegen/flash helpers (a
  # wrong-but-valid emitted mask/byte the compile matrix can't catch) and the
  # alloy-devices validator (which must report, not crash, on bad data).
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: run CLI + validator unit tests
        working-directory: alloy
        run: |
          uv run --project tools/alloy python -m pytest tools/alloy/tests ../alloy-devices/tests -q

  # NORTH_STAR guard #7 acceptance test: a wrong pin route must FAIL to compile
  # with a diagnostic that names the pin — the compile-time-error UX can't
  # silently regress into acceptance or an unreadable template dump.
  compile-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: a wrong pin route must fail to compile, naming the pin
        working-directory: alloy
        run: uv run --project tools/alloy python scripts/check_compile_errors.py

  # NORTH_STAR goal #2: adding a chip that reuses known IP versions costs
  # "zero new C++ — only data". That promise is only real if the emitter can
  # consume EVERY shipped chip. The board×example matrix compiles only the
  # handful of chips boards reference, so this runs the chip-level codegen over
  # every chip in the database — an emitter bug on any of the ~400 builder-
  # generated chips (e.g. dereferencing an uncurated stub) fails CI here instead
  # of shipping unconsumable data. Generate-only (no cross-compile) — fast.
  gen-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: generate every chip in the database
        working-directory: alloy
        run: uv run --project tools/alloy python scripts/gen_all_chips.py

  # Upgrades guard #9 from "compiles" to "executes" for the boards Renode models.
  # Each matrix leg boots one example on the data-generated platform (alloy
  # emulate) and runs a Robot test that asserts real behaviour on the emulated
  # UART. The platform (.repl) is generated from chip data, so it can't drift
  # from the real target.
  #
  #  - firmware_boots.robot (uart_echo): boots and prints its banner.
  #  - uart_echo_roundtrip.robot (uart_echo): injects a line and asserts the
  #    firmware echoes it back — proves the RX+echo+TX I/O path, not just boot.
  #  - async_runs.robot (async_heartbeat): the coroutine executor SCHEDULES
  #    REPEATEDLY — after the banner it must emit three successive "beat N" lines,
  #    each gated behind a `co_await delay(250ms)`. Proves the async runtime
  #    actually runs on the ISA, not just that it compiled.
  #  - async_io.robot (async_io): a coroutine parked on a PERIPHERAL is resumed by
  #    that peripheral's interrupt — asserted on the executor's resume COUNT per
  #    leg (SPI, I2C, DMA), which the same I/O done without suspending cannot
  #    produce.
  #
  # `experimental: true` legs are continue-on-error: a real signal that doesn't
  # block merges while a new board/behaviour is being confirmed green (the local
  # host is Apple Silicon and the pinned Renode tlib is x86_64, so these were
  # authored without an end-to-end local run). Legs WITHOUT the flag are blocking
  # — the proven path can't regress. Drop `experimental` from a leg once it has a
  # few green runs. Extend the matrix as emit/renode.py's RENODE_CPU / RENODE_UART
  # maps grow to cover more families.
  emulate:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Proven-green, blocking — the reference boot oracle.
          - board: nucleo_f722ze
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          - board: nucleo_g071rb
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          # Async runtime — BLOCKING. Green on every run (banner + beat 1/2/3 +
          # tick), and timeout=30 gives ~37x headroom over the ~0.8 s of firmware
          # time needed, so "the coroutine executor schedules two concurrent tasks
          # on the real ISA" is now a hard gate: a regression in the runtime breaks
          # CI. This is the Track-1 payoff — emulation proves behaviour, not just
          # compilation.
          - board: nucleo_f722ze
            example: async_heartbeat
            robot: async_runs.robot
            banner: alloy async_heartbeat ready
          - board: nucleo_g071rb
            example: async_heartbeat
            robot: async_runs.robot
            banner: alloy async_heartbeat ready
          # Broader board coverage — BLOCKING (deterministic boot, green on
          # several runs). nucleo_g0b1re (STM32G0) shares the proven STM32 USART
          # model; same70_xplained is a whole new VENDOR, Microchip Cortex-M7 on
          # UART.SAM_USART. The RP2040 boards stay DEFERRED — this Renode build
          # ships no RP2040 peripheral models at all (not a platform-emit gap; it
          # needs a newer Renode). See [[alloy-audit-2026-07]].
          - board: nucleo_g0b1re
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          - board: same70_xplained
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          # The async runtime on a SECOND vendor — BLOCKING. Two concurrent
          # coroutines on a Microchip Cortex-M7 (banner + beat 1/2/3 + tick on
          # SAM_USART), proving the heap-less executor + timer wheel are genuinely
          # portable, not ST-specific. Green in CI + locally (native arm64 Renode).
          - board: same70_xplained
            example: async_heartbeat
            robot: async_runs.robot
            banner: alloy async_heartbeat ready
          # I/O behaviour (echo roundtrip) — BLOCKING. Injects a line, asserts the
          # firmware echoes it. Green across several runs.
          - board: nucleo_g071rb
            example: uart_echo
            robot: uart_echo_roundtrip.robot
            banner: alloy uart_echo ready
          # THE PERIPHERAL SURFACE, EXECUTING — BLOCKING. Two legs, same
          # examples/uart_frame/src/main.cpp, no preprocessor, and they must
          # print DIFFERENT lines: the STM32G0's usart_v4 has an 8-byte RX FIFO
          # and the STM32F7's usart_v3 has none, so `Inst::feat::rx_fifo_depth`
          # (generated from alloy-devices, 0 = absent) drives an `if constexpr`
          # to two different strings. If the generated number never reached the
          # image — or reached it as a silent default zero — the two legs print
          # the same thing and one of them fails. That is the degree mechanism
          # asserted on emulated silicon rather than argued.
          # Green locally on the pinned Renode (both legs).
          - board: nucleo_g071rb
            example: uart_frame
            robot: uart_frame_surface.robot
            banner: "alloy uart_frame: this port, described by the surface"
          - board: nucleo_f722ze
            example: uart_frame
            robot: uart_frame_surface.robot
            banner: "alloy uart_frame: this port, described by the surface"
            extra_args: "--variable FIFO:'rx-fifo: none (feat::rx_fifo_depth == 0)'"
          # I2C DRIVER CONFORMANCE — BLOCKING. The driver talks to a device on the
          # bus with no hardware: the platform carries the real STM32 I2C
          # controller, the robot attaches a DummyI2CSlave at 0x08, and i2c_read
          # does a 1-byte write + 1-byte read, printing "device acked" only if both
          # were ACKed. (A bus SCAN can't be emulated: probe() is a zero-length
          # write / NBYTES=0, valid on silicon but unimplemented by Renode's
          # STM32F7_I2C model — diagnosed by tracing register traffic on a local
          # arm64 Renode. A real >=1-byte transfer is what the model supports.)
          # The leg then repeats the traffic INTERRUPT-DRIVEN: the robot turns the
          # mock into an echo, three bytes go out from the driver's ISR and come
          # back into it as "i2c async: 0xdeadbe", and the completion callback
          # prints "i2c irq: fired". That needs the platform's `EventInterrupt ->
          # nvic@23` line — with the controller left unwired the same firmware
          # prints "i2c irq: NOT fired" and the leg FAILS in ~31s instead of
          # passing in ~1s, verified locally.
          # Green in CI + locally, with a negative control (no slave → "no ack").
          # PHASE 4 added one line at the end: the one-shot DMA read, asserted
          # as the BOUNDED REFUSAL it honestly is. The pinned model of this IP
          # has NO DMA request output (1.16.1's I2C.STM32F7_I2C exposes only
          # EventInterrupt/ErrorInterrupt; upstream added one after the
          # release), so no byte can move and the leg asserts that the facade
          # says so in ~8 s of emulated time rather than hanging. The run cost
          # 2.67 s -> 11.52 s locally; with the wait's budget removed the same
          # leg FAILS at 283 s. That is what the line defends. See the robot's
          # Documentation for the two ways to make it actually witnessable —
          # both are maintainer calls.
          - board: nucleo_g071rb
            example: i2c_read
            robot: i2c_read.robot
            banner: alloy i2c_read
          # SPI DRIVER CONFORMANCE — the full-duplex sibling of i2c_read. The
          # platform carries the real STM32 SPI controller (now that CI is pinned to
          # Renode 1.16.1, where SPI.STM32SPI's `series` is optional); the robot
          # attaches a DummySPISlave primed with 0x5A via EnqueueValue and spi_read
          # exchanges a byte, printing "spi: 0x5a" iff it read back exactly what the
          # slave shifted out on MISO (a different primed value prints a different
          # byte — no coincidental pass). The leg then runs the SAME exchange
          # INTERRUPT-DRIVEN: three more primed bytes come back as "spi async:
          # 0xdeadbe" (bytes 2 and 3 are clocked from the SPI ISR, so the pattern
          # only appears if the handler ran) and "spi irq: fired" is printed from
          # the completion callback. SPI.STM32SPI honours the CR2 enable bits, so
          # a driver that forgets RXNEIE prints "spi irq: NOT fired" and the leg
          # fails — verified locally by deliberately not arming it. Green on the
          # pinned Renode 1.16.1 in CI and locally — BLOCKING.
          #
          # PHASE 4 / ANCHOR 2.4 added a third leg to the same robot: four bytes
          # exchanged over the PAIR of channels the board assigns to
          # spi.rx/spi.tx, with the CPU touching neither DR nor a channel
          # register. "spi dma: 0xf0f1f2f3" is the four primed values arriving
          # by DMA; "spi dma peer: 0x9e" is where the device's cursor stands
          # afterwards, which only reaches that value if the transmit channel
          # clocked four cycles. The existing three assertions are byte-for-byte
          # unchanged — the platform's new request wire is inert while
          # CR2.RXDMAEN is clear, so the polled and interrupt paths cannot see
          # it. KEPT BLOCKING on this board rather than staged experimental:
          # same board, same pinned emulator, run locally end to end (2.54 s),
          # and THREE negative controls each taking it red without hanging —
          # the wire moved by one index (2.46 s), the pair armed TX before RX
          # (32.8 s, the design's §1 order as a red/green fact rather than
          # doctrine), CR2.RXDMAEN never raised (32.8 s). If you would rather
          # stage it, move the DMA assertions behind a --variable like
          # async_io's SPI_LEG and add an experimental twin.
          - board: nucleo_g071rb
            example: spi_read
            robot: spi_read.robot
            banner: alloy spi_read
          # THE SAME ANCHOR ON THE SECOND G0 and on the F7 — one portable
          # main.cpp and one robot across BOTH DMA engines: the G0s ride dma1
          # CHANNEL 4 (1-based, free router, DMAMUX) and the F7 rides dma2
          # STREAM 0 (0-based, CHSEL, through alloy's own generated stream
          # model). Nothing but board.json dma: lines differ, which is the
          # design's whole promise for a new board. NOT witnessed on either:
          # the request-id half of the route — Renode models no DMAMUX at all
          # and CHSEL routes nothing in the generated model, and the platform
          # wire and the firmware route come from the same board statement.
          # `experimental` per the convention above: new board+robot pairs,
          # green locally (g0b1re 2.25 s, f722ze 6.85 s; pinned Renode 1.16.1,
          # arm64), plus a wire-moved-by-one control on the F7 (red in 34.6 s).
          # PROMOTE after a few green CI runs.
          - board: nucleo_g0b1re
            example: spi_read
            robot: spi_read.robot
            banner: alloy spi_read
            experimental: true
          - board: nucleo_f722ze
            example: spi_read
            robot: spi_read.robot
            banner: alloy spi_read
            experimental: true
          # ADC DRIVER CONFORMANCE — BLOCKING — against Renode's OWN
          # Analog.STM32G0_ADC (the inline Python model this project used to
          # write is gone). The robot feeds distinct voltages to distinct
          # channels (SetDefaultValue: 1650 mV ch3, 3300 mV ch4); adc_read
          # converts both, so "adc ch3: 2048" + "adc ch4: 4095" (= round(mV/
          # 3300*4095) at the platform's 3.3 V reference) prove channel routing
          # AND the conversion math — the wrong channel prints 0 (verified) and
          # the old "adc: 1003" never appears (verified). Two vacuous spots,
          # stated: the model lacks ISR.CCRDY (bit 13 reserved in the 1.16.1
          # source), so the generated .resc hooks it into every ISR read and the
          # driver's RM0444 CCRDY poll passes unconditionally; ADCAL is a tagged
          # no-op. Without the hook the firmware hangs in that poll (register-
          # trace witnessed — see emit/renode.py). Green locally (pinned Renode
          # 1.16.1).
          - board: nucleo_g071rb
            example: adc_read
            robot: adc_read.robot
            banner: alloy adc_read
          # ADC ANALOG WATCHDOG — BLOCKING — the SUB-RESOURCE shape, on the same
          # Analog.STM32G0_ADC model and the same voltage fixture as the leg
          # above, but on the G0B1RE (whose die names the instance adc1). Four
          # printed lines from ONE window: quiet inside it, TRIPPED outside,
          # quiet after clearing, quiet after disarming across the sample that
          # tripped it — two of which contradict each other unless the watchdog
          # is real, so no stuck flag passes all four. PASS in 1.61 s locally
          # (pinned Renode 1.16.1) with a negative control: delete AWD1EN from
          # the driver and it fails in 31.7 s on the TRIPPED line alone.
          # VACUOUS SPOTS, stated: the model is constructed with
          # watchdogCount: 1, so ordinals 1 and 2 — which this die has and this
          # driver programs, in a different register shape — are NOT exercised,
          # and neither is AWDnIE (the driver polls). The CCRDY shim above
          # applies here too.
          - board: nucleo_g0b1re
            example: adc_watchdog
            robot: adc_watchdog.robot
            banner: alloy adc_watchdog
          # ADC DMA RING — BLOCKING — the dma-streams phase-1 anchor (design
          # §2.1): continuous conversions stream into a 256-sample ring by DMA
          # while the firmware takes hardware-stable halves, asserting in
          # take() order that the HALF interrupt delivered before the FULL one,
          # that the full one delivered, and that the ring WRAPPED (pattern
          # written twice) — each half pinned to the fed millivolts
          # (SetDefaultValue 1650 ch3 -> v=2048..2048; an unrouted or unfed
          # channel prints 0). Both G0 Nucleos, one main.cpp; the ADC instance
          # name differs per die (adc vs adc1) and rides in as a robot
          # variable. Green locally on the pinned Renode 1.16.1 (1.7 s/1.6 s,
          # emitter-generated platforms) with two negative controls verified
          # red: a wrong fed voltage (31.5 s, the value lines), and swapping
          # the ring's two event-attach lines (31.5 s — the model's global
          # flag-clears eat the wrap when dispatch order flips; see the
          # comment in alloy/dma.hpp). VACUOUS SPOTS, stated in
          # adc_stream.robot: DMAMUX request routing (unmodelled — the
          # generated request bridge and the firmware's route derive from the
          # same board.json statement), once-per-boundary half events (the
          # model re-raises HTIF per second-half sample, so missed() is
          # diagnostic only), CONT (tagged no-op; EXTEN shim paces the
          # stream), and the CCRDY shim shared with every ADC leg.
          - board: nucleo_g071rb
            example: adc_stream
            robot: adc_stream.robot
            banner: alloy adc_stream
          - board: nucleo_g0b1re
            example: adc_stream
            robot: adc_stream.robot
            banner: alloy adc_stream
            extra_args: "--variable ADC:sysbus.adc1"
          # DMA DRIVER CONFORMANCE — BLOCKING — against Renode's OWN
          # DMA.STM32G0DMA, NVIC-wired (the purpose-written inline model was
          # replaced in commit 52c2642, which this comment used to predate).
          # dma_uart sends a line to the UART BY DMA (m2p), so "dma via DMA" on
          # the UART proves the channel config + transfer + completion moved the
          # bytes. Green in CI + locally.
          - board: nucleo_g071rb
            example: dma_uart
            robot: dma_uart.robot
            banner: alloy dma_uart
          # DRIVER AWAITABLES — BLOCKING. async_runs.robot proves the executor and
          # the timer wheel run on the ISA; this proves a coroutine parked on a
          # PERIPHERAL is resumed by its interrupt. async_io runs one leg per
          # interrupt-driven bus (SPI, I2C, DMA) and prints how many times the
          # executor RESUMED that leg's task — 2, 3, 2 respectively. The count is
          # the assertion: the same I/O written WITHOUT coroutines (start, then
          # spin on busy()) retires its task in one resume and prints resumes=1,
          # which fails; and an interrupt that never fires makes the leg's bounded
          # pump print "STUCK" and fail in ~31 s instead of hanging the run. Both
          # were verified locally by deliberately breaking the firmware.
          # SINCE dma-streams PHASE 2 the DMA leg is ALSO anchor 2.3 (design
          # §2.3): the TX channel is claimed FROM THE BOARD'S debug_uart.tx
          # route (dma1 ch3 — the ch2_3 shared-IRQ line), and the robot
          # asserts the "dma route: claimed board debug_uart.tx" marker the
          # explicit-channel escape hatch cannot print (negative control
          # verified red locally, 31.6 s at the marker wait).
          - board: nucleo_g071rb
            example: async_io
            robot: async_io.robot
            banner: alloy async_io
          # MICROSECOND TIMEBASE — BLOCKING. uptime_us() interpolates SysTick CVR
          # between 1 ms ticks (the seam Modbus RTU t3.5 silence detection needs).
          # The firmware asserts IN-BAND: a 100k-sample monotonicity sweep across
          # ~100 tick boundaries (a torn CVR/tick read = a ~1000 µs reverse step =
          # "monotonic: FAIL"), then measures sleep_for(50ms) in µs and demands
          # 50'000..60'000 ("rate: FAIL dt=NNN" otherwise). The leg gates on the
          # firmware's own printed verdicts, so it does NOT depend on Renode
          # reproducing sub-millisecond wall time — only on SysTick CVR decrement,
          # which the async/timer legs already rely on.
          - board: nucleo_g071rb
            example: time_probe
            robot: time_probe.robot
            banner: alloy time_probe
          # MODBUS RTU SERVER — the robot plays a byte-level Modbus master with
          # an INDEPENDENT CRC-16 (bitwise, in monitor Python) against the
          # firmware's rtu_server: a well-formed FC03 answered byte-exactly, a
          # CRC-corrupt request and another unit's request answered with TOTAL
          # SILENCE, an out-of-model address answered with exception 0x02, and
          # the oversized-length sequence (11 10 00 00 00 7F FF — 7 bytes that
          # permanently wedged the reference C library this design was measured
          # against) recovered from in one t3.5, with the next valid request
          # served. Runs at 9600 baud so t3.5 = 4011 µs spans several SysTick
          # periods — the leg tests framer LOGIC, not the emulator's sub-ms
          # fidelity.
          #
          # SINCE dma-streams PHASE 2 this leg is ALSO anchor 2.2 (design
          # §2.2): RX rides a DMA ring on the board-assigned debug_uart.rx
          # route — no per-byte RX interrupt, frames drained via readable()/
          # consume() into the server's on_bytes — and the robot asserts the
          # firmware's "modbus: dma ring rx" marker, which the polled
          # fallback cannot print (negative control verified red locally:
          # the polled build fails the leg in 27.6 s at the marker wait).
          # Every request/response/silence assertion is byte-for-byte the
          # polled-era suite. NOT witnessed here: the IDLE frame-gap wake —
          # the pinned USART model does not implement IDLE (emit/renode.py
          # states the measured fact); SysTick provides the wakes under
          # emulation. BLOCKING since phase 2: six consecutive green CI runs
          # as experimental (the convention's promotion bar) plus local
          # end-to-end runs of the ring path on both G0s (pinned Renode
          # 1.16.1, 4.2 s each).
          - board: nucleo_g071rb
            example: modbus_rtu_server
            robot: modbus_rtu.robot
            banner: alloy modbus_rtu_server ready
          # The same anchor on the second wired G0 (usart2 there too; the dma
          # assignment is the same board.json statement). `experimental` per
          # the convention above: this board+robot pair is NEW to CI — green
          # locally (4.19 s, pinned Renode 1.16.1, arm64) but no x86_64 tlib
          # run yet. PROMOTE after a few green CI runs.
          - board: nucleo_g0b1re
            example: modbus_rtu_server
            robot: modbus_rtu.robot
            banner: alloy modbus_rtu_server ready
            experimental: true
          # THE SAME ANCHOR ON THE F7s — dma-streams phase 3 (design §6 row
          # 3): the SAME portable main.cpp, opened by nothing but the boards'
          # debug_uart.rx/tx assignments; RX rides dma1 STREAM 1 (0-based, ST
          # numbering) through the st/dma_v2 engine and the emitted
          # stream-engine model (emit/renode.py DMA_V2_CS — CIRC reload +
          # HTIF over the stock model's measured behaviours; CHSEL routing is
          # by-construction unwitnessable there, same caveat as the G0
          # DMAMUX bridge). Every assertion is byte-for-byte the G0 suite's.
          # `experimental` per the convention: new board+robot pairs — green
          # locally on both (7.6/7.8 s, pinned Renode 1.16.1, arm64), plus a
          # negative control (DMAR raise stripped -> MODBUS-FAIL in ~8 s,
          # no hang). PROMOTE after a few green CI runs.
          - board: nucleo_f722ze
            example: modbus_rtu_server
            robot: modbus_rtu.robot
            banner: alloy modbus_rtu_server ready
            experimental: true
          - board: nucleo_f767zi
            example: modbus_rtu_server
            robot: modbus_rtu.robot
            banner: alloy modbus_rtu_server ready
            experimental: true
          # ANCHOR 2.3 ON THE F7 — the async_io DMA leg claims the F767ZI's
          # debug_uart.tx route (dma1 stream 3, request from the matched
          # triple) and the DMA-carried line + resumes=2 prove the stream-3
          # NVIC wake is real under the emitted model. SPI_LEG/I2C_LEG=False:
          # this board has neither bus in its board.json, the firmware folds
          # those legs closed at compile time, and the robot asserts the
          # firmware SAYS SO (the "not available" lines) instead of skipping
          # silently. `experimental` per the convention: new board+robot
          # pair, green locally (6.6 s, pinned Renode 1.16.1, arm64).
          - board: nucleo_f767zi
            example: async_io
            robot: async_io.robot
            banner: alloy async_io
            extra_args: "--variable SPI_LEG:False --variable I2C_LEG:False"
            experimental: true
          # BUS BRIDGE — libs/bus F2: the robot plays the PEER BOARD with an
          # independent frame implementation in monitor Python (its own
          # bitwise CRC-32 vs the firmware's bytewise-branchless one — same
          # spec, separately written). Pings cross the bridge, republish on
          # the firmware's LOCAL bus, a subscriber-service answers by
          # publishing a pong whose count only service state can produce —
          # an echoing firmware cannot pass. Negative cases: a CRC-corrupt
          # frame and an unknown message id each earn total silence and cost
          # exactly one frame. Framing is length-driven (no silence windows),
          # so nothing leans on emulator clock fidelity. `experimental` per
          # the convention: new board+robot pair — green locally first;
          # PROMOTE after a few green CI runs.
          - board: nucleo_g071rb
            example: bus_bridge
            robot: bus_bridge.robot
            banner: alloy bus_bridge ready
            experimental: true
          # PIN INTERRUPT CONFORMANCE — BLOCKING. The emitted platform now carries
          # real GPIO ports and a real EXTI, so a monitor-injected edge travels the
          # silicon path: pad -> EXTICR port select -> trigger -> pending -> shared
          # NVIC vector -> alloy::irq chain -> the driver's handler. pin_irq arms
          # board::user_button().on_active() and NEVER calls is_active(), so the
          # only thing it can report is a counter its INTERRUPT bumped. The robot
          # drives the pin the WRONG way first and then presses: "count=00000001"
          # is three assertions at once — it fired, it honoured the board's
          # active-low polarity (an extra count would mean both edges were armed),
          # and it cleared its write-1-to-clear pending bit. Verified locally with
          # five negative controls, each one thing different: no edge at all ->
          # "pin irq: NOT fired" and THIS leg fails in 31 s; the rising edge alone
          # -> NOT fired, fails in 31 s; the same edges on gpioa -> NOT fired
          # (Renode honours EXTICR); the platform hand-edited to feed the wrong
          # NVIC vector -> NOT fired, fails in 31 s; and the ISR's two pending
          # stores deleted -> renode-test makes no further progress for 150 s
          # where the good firmware passes in 2 s, which is a SPIN, not a pass.
          - board: nucleo_g071rb
            example: pin_irq
            robot: pin_irq.robot
            banner: alloy pin_irq
          # CRASH REPORTING END TO END — BLOCKING — five boots of one machine.
          # Boot 1 prints "no crash on record", then fault::trigger() (a
          # software-pended NMI — Renode never vectors ORGANIC faults, so a
          # wild jump would just kill the core with the vector table unread)
          # drives three crash/report cycles: each reboot is a real
          # SYSRESETREQ, the record crosses it in .noinit RAM, and the
          # firmware prints "RECOVERED FROM A FAULT pc=..." with the
          # consecutive counter counting 1-2-3 into safe mode. The robot then
          # pends HardFault through the NVIC to prove the second trampoline:
          # "(4 in a row)". The emitted .resc's `macro reset` is what makes
          # the reboots work — without it SYSRESETREQ parks Renode forever.
          # Negative control: strip the strong handlers (weak Default_Handler
          # wins) and the device dies silently at the first fault — no
          # RECOVERED line, leg FAILS in ~10 s where the good build passes in
          # ~3 s. Verified locally on the pinned Renode 1.16.1, both boards.
          - board: nucleo_g071rb
            example: crash_report
            robot: crash_report.robot
            banner: alloy crash_report ready
          - board: nucleo_f722ze
            example: crash_report
            robot: crash_report.robot
            banner: alloy crash_report ready
          # CONCURRENCY MODEL — BLOCKING — and the source of every number in
          # docs/guide/async.md. The firmware measures itself against the SysTick
          # counter, calibrates against 1000 straight-line nops, and prints its
          # own verdicts; the leg asserts ONLY those, never a figure, because
          # Renode charges a fixed slice of virtual time per instruction and
          # pinning an absolute cost would make a Renode bump a red build.
          # Negative controls, both run locally: (1) the same robot against the
          # nucleo_f722ze build, where vector 22 is CAN1_SCE and not TIM17, so
          # the strong handler is an orphan — "irq vectored: FAIL", leg red in
          # 121 s (the bounded ISR wait is what makes that a FAILURE instead of a
          # hang); (2) the 5 ms non-yielding task's spin cut to 0 — "verdict
          # cooperative: FAIL", leg red in 31 s, so that verdict is measuring the
          # hog and not a constant. Green locally in 1.9 s on Renode 1.16.1.
          - board: nucleo_g071rb
            example: concurrency_probe
            robot: concurrency_probe.robot
            banner: alloy concurrency_probe
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: install renode (PINNED v1.16.1 portable)
        run: |
          # Pinned, NOT builds.renode.io/renode-latest (a moving nightly). A stable
          # release makes the emulation gate reproducible and — critically — lets a
          # peripheral model verified against local Renode 1.16.1 be trusted in CI.
          # renode-latest drift is exactly what broke a platform once (SPI.STM32SPI
          # gained a required `series` ctor param). Bump deliberately, re-verifying
          # locally against the same version.
          RENODE_VER=1.16.1
          url="https://github.com/renode/renode/releases/download/v${RENODE_VER}/renode-${RENODE_VER}.linux-portable.tar.gz"
          wget -q "$url" -O renode.tar.gz
          mkdir -p "$HOME/renode" && tar xf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          # renode-test (Robot framework runner) needs these Python deps
          pip3 install --quiet -r "$HOME/renode/tests/requirements.txt"
      - name: build ${{ matrix.example }} + emit Renode platform
        id: emit
        working-directory: alloy/examples/${{ matrix.example }}
        run: |
          out=$(uv run --project ../../tools/alloy alloy emulate --board ${{ matrix.board }} --emit-only)
          echo "$out"
          echo "resc=$(echo "$out" | awk '/^script:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "uart=$(echo "$out" | awk '/^uart:/{print $2}')" >> "$GITHUB_OUTPUT"
      - name: boot ${{ matrix.example }} under Renode and assert behaviour
        # RESC is absolute so the Robot's `include @RESC` resolves (renode-test
        # resolves it relative to the .robot file, not cwd). On CI the runner
        # path is space-free, so emit/renode.py writes absolute .repl/.elf paths
        # inside the .resc too (nested @-paths resolve relative to cwd here, not
        # the .resc). The bare-name fallback only kicks in for local dirs with
        # spaces, where `alloy emulate` runs Renode from the .resc's own dir.
        run: |
          renode-test \
            --variable RESC:'${{ steps.emit.outputs.resc }}' \
            --variable UART:${{ steps.emit.outputs.uart }} \
            --variable BANNER:'${{ matrix.banner }}' \
            ${{ matrix.extra_args }} \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/${{ matrix.robot }}"

  # The UART update bootloader end-to-end in emulation: build the bootloader
  # (--slot bl), pack a slot-A app with `alloy image`, place it at the slot base,
  # and assert verify -> newest-valid pick -> Cortex-M jump -> the APP's banner;
  # plus the blank-board path (stays recoverable in update mode). Verified green
  # in CI and locally on the pinned Renode — BLOCKING.
  bootloader-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: install renode (PINNED v1.16.1 portable)
        run: |
          RENODE_VER=1.16.1
          url="https://github.com/renode/renode/releases/download/v${RENODE_VER}/renode-${RENODE_VER}.linux-portable.tar.gz"
          wget -q "$url" -O renode.tar.gz
          mkdir -p "$HOME/renode" && tar xf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          pip3 install --quiet -r "$HOME/renode/tests/requirements.txt"
      - name: build the bootloader (--slot bl) + emit the platform
        working-directory: alloy/examples/bootloader_uart
        run: |
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot bl
          uv run --project ../../tools/alloy alloy emulate --board nucleo_g071rb --emit-only
          out="$PWD/.alloy/build-tree/nucleo_g071rb/out"
          echo "repl=$out/nucleo_g071rb.repl" >> "$GITHUB_ENV"
          echo "bl_elf=$out/bootloader_uart.elf" >> "$GITHUB_ENV"
          # A platform may name C#-backed types (the ADC request bridge, the
          # stream-engine DMA model), and Renode resolves those only if the .cs
          # is compiled FIRST. `alloy emulate` puts the includes in the .resc it
          # generates; the legs below hand-roll their own, so they have to carry
          # the includes themselves. DISCOVERED, not named: a platform that grows
          # a new shim tomorrow is picked up here without touching this file —
          # which is the failure that took bootloader-e2e red the first time CI
          # ran after the G0 platform gained DMA.STM32G0DMARequestBridge.
          {
            echo "cs_includes<<CSEOF"
            for cs in "$out"/*.cs; do [ -e "$cs" ] && echo "include @$cs"; done
            echo "CSEOF"
          } >> "$GITHUB_ENV"
      - name: build a slot-A app + pack it with `alloy image`
        working-directory: alloy/examples/uart_echo
        run: |
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot a
          arm-none-eabi-objcopy -O binary \
            .alloy/build-tree/nucleo_g071rb/out/uart_echo.elf /tmp/app.bin
          uv run --project ../../tools/alloy alloy image /tmp/app.bin --set-version 1 -o /tmp/app.img
          # v2 of the same app doubles as the "bad" update in the lifecycle test:
          # uart_echo never calls confirm(), so its trial must exhaust and revert.
          uv run --project ../../tools/alloy alloy image /tmp/app.bin --set-version 2 -o /tmp/bad.img
          # ANTI-ROLLBACK: version 0 of the very same bytes. The device confirms
          # version 1 first, so this is a genuine, well-formed DOWNGRADE and must
          # be refused (ota_error 11) — while /tmp/bad.img at version 2 must still
          # be accepted minutes later in the same run. That pair is the control.
          uv run --project ../../tools/alloy alloy image /tmp/app.bin --set-version 0 -o /tmp/old.img
          # the slot base comes from the GENERATED layout, never hardcoded here
          slot_a=$(grep -oE 'slot_a_base = 0x[0-9a-f]+' \
            .alloy/generated/nucleo_g071rb/alloy/slots.hpp | grep -oE '0x[0-9a-f]+')
          echo "slot_a=$slot_a" >> "$GITHUB_ENV"
      - name: build the confirming app (--slot b) — the "good" update
        working-directory: alloy/examples/ota_app
        run: |
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot b
          arm-none-eabi-objcopy -O binary \
            .alloy/build-tree/nucleo_g071rb/out/ota_app.elf /tmp/good.bin
          uv run --project ../../tools/alloy alloy image /tmp/good.bin --set-version 1 -o /tmp/good.img
      - name: craft the two machines (image in slot A / blank slots)
        run: |
          cat > /tmp/full.resc <<EOF
          using sysbus
          mach create "boot"
          $cs_includes
          machine LoadPlatformDescription @$repl
          sysbus LoadELF @$bl_elf
          sysbus LoadBinary @/tmp/app.img $slot_a
          EOF
          cat > /tmp/empty.resc <<EOF
          using sysbus
          mach create "bootE"
          $cs_includes
          machine LoadPlatformDescription @$repl
          sysbus LoadELF @$bl_elf
          EOF
      - name: run the bootloader oracle
        run: |
          renode-test \
            --variable RESC_FULL:/tmp/full.resc \
            --variable RESC_EMPTY:/tmp/empty.resc \
            --variable UART:sysbus.usart2 \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/bootloader_boots.robot"
      # PER-DEVICE FACTORY IDENTITY. `alloy provision write -o` encodes the same
      # 64-byte record the probe would program; the machines below place it at
      # the layout's provision_base and boot examples/factory out of slot A
      # through the REAL bootloader, so the identity read happens inside a
      # product firmware after an A/B boot rather than in a test harness.
      # The three refusals are the claim: erased page, foreign bytes and a
      # one-bit corruption each get their OWN verdict.
      - name: build the line-test app + its identity fixtures
        working-directory: alloy/examples/factory
        run: |
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot a
          arm-none-eabi-objcopy -O binary \
            .alloy/build-tree/nucleo_g071rb/out/factory.elf /tmp/factory.bin
          uv run --project ../../tools/alloy alloy image /tmp/factory.bin \
            --set-version 1 -o /tmp/factory.img
          uv run --project ../../tools/alloy alloy provision write \
            --serial ALY-0001-A7 --mac 02:1a:2b:3c:4d:5e --hw-rev 3 --batch 42 \
            -o /tmp/id.bin
          # ONE BIT flipped inside the serial, everything else identical: only
          # the record's CRC can tell these two apart.
          python3 -c "import pathlib;b=bytearray(pathlib.Path('/tmp/id.bin').read_bytes());b[8]^=1;pathlib.Path('/tmp/id_corrupt.bin').write_bytes(bytes(b))"
          # Erased flash reads all-ones. Renode ZERO-fills memory nobody loaded,
          # so the blank case must load 0xFF explicitly or it would silently
          # exercise the foreign-bytes path instead (observed, not theorised).
          python3 -c "import pathlib;pathlib.Path('/tmp/erased.bin').write_bytes(b'\xff'*64)"
          # the address comes from the GENERATED layout, never hardcoded here
          prov=$(grep -oE 'provision_base = 0x[0-9a-f]+' \
            .alloy/generated/nucleo_g071rb/alloy/slots.hpp | grep -oE '0x[0-9a-f]+')
          echo "provision_base=$prov" >> "$GITHUB_ENV"
      - name: run the provisioning oracle
        run: |
          for k in provisioned blank corrupt foreign; do
            cat > /tmp/prov_$k.resc <<EOF
          using sysbus
          mach create "prov$k"
          $cs_includes
          machine LoadPlatformDescription @$repl
          sysbus LoadELF @$bl_elf
          sysbus LoadBinary @/tmp/factory.img $slot_a
          EOF
          done
          echo "sysbus LoadBinary @/tmp/id.bin $provision_base" >> /tmp/prov_provisioned.resc
          echo "sysbus LoadBinary @/tmp/erased.bin $provision_base" >> /tmp/prov_blank.resc
          echo "sysbus LoadBinary @/tmp/id_corrupt.bin $provision_base" >> /tmp/prov_corrupt.resc
          # prov_foreign.resc deliberately loads NOTHING at provision_base
          renode-test \
            --variable RESC_PROVISIONED:/tmp/prov_provisioned.resc \
            --variable RESC_BLANK:/tmp/prov_blank.resc \
            --variable RESC_CORRUPT:/tmp/prov_corrupt.resc \
            --variable RESC_FOREIGN:/tmp/prov_foreign.resc \
            --variable UART:sysbus.usart2 \
            --variable PROVISION_BASE:$provision_base \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/provision.robot"
      # SECOND FAMILY: the SAME bootloader source on the STM32F7's sector-based
      # flash (st_flash_f7: mixed 16K/64K/128K sectors; slots on natural sector
      # boundaries). The platform carries MTD.STM32F4_FlashController, so slot
      # erases here are REAL modeled sector erases, not no-ops.
      - name: build the F722 bootloader + slot-A app image
        working-directory: alloy/examples/bootloader_uart
        run: |
          uv run --project ../../tools/alloy alloy build --board nucleo_f722ze --slot bl
          uv run --project ../../tools/alloy alloy emulate --board nucleo_f722ze --emit-only
          out="$PWD/.alloy/build-tree/nucleo_f722ze/out"
          echo "f7_repl=$out/nucleo_f722ze.repl" >> "$GITHUB_ENV"
          echo "f7_bl_elf=$out/bootloader_uart.elf" >> "$GITHUB_ENV"
          # See the G0 leg above for why these are discovered rather than named.
          {
            echo "f7_cs_includes<<CSEOF"
            for cs in "$out"/*.cs; do [ -e "$cs" ] && echo "include @$cs"; done
            echo "CSEOF"
          } >> "$GITHUB_ENV"
          cd ../uart_echo
          uv run --project ../../tools/alloy alloy build --board nucleo_f722ze --slot a
          uv run --project ../../tools/alloy alloy image \
            .alloy/build-tree/nucleo_f722ze/out/uart_echo.elf --set-version 1 -o /tmp/f7_app.img
          slot_a=$(grep -oE 'slot_a_base = 0x[0-9a-f]+' \
            .alloy/generated/nucleo_f722ze/alloy/slots.hpp | grep -oE '0x[0-9a-f]+')
          echo "f7_slot_a=$slot_a" >> "$GITHUB_ENV"
      - name: run the F722 bootloader oracle
        run: |
          cat > /tmp/f7_full.resc <<EOF
          using sysbus
          mach create "f7A"
          $f7_cs_includes
          machine LoadPlatformDescription @$f7_repl
          sysbus LoadELF @$f7_bl_elf
          sysbus LoadBinary @/tmp/f7_app.img $f7_slot_a
          EOF
          cat > /tmp/f7_empty.resc <<EOF
          using sysbus
          mach create "f7E"
          $f7_cs_includes
          machine LoadPlatformDescription @$f7_repl
          sysbus LoadELF @$f7_bl_elf
          EOF
          renode-test \
            --variable RESC_FULL:/tmp/f7_full.resc \
            --variable RESC_EMPTY:/tmp/f7_empty.resc \
            --variable UART:sysbus.usart3 \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/bootloader_boots.robot"
      # THIRD FAMILY / SECOND VENDOR: Microchip SAME70's EEFC (page latch + WP
      # commits, 16-page EPA erase, ECC row-once — the page-buffered driver with
      # the flush() seam). The platform carries the purpose-written EFC model:
      # FKEY-validated commands, REAL EPA erases through the bus. Boot legs plus
      # the good-only wire lifecycle (install -> trial -> confirm -> PERSISTED
      # across reset = the flush-durability proof); the watchdog rollback phases
      # are covered on G0/F7 (SAM4S_WDT needs an RSTC chain, deferred).
      - name: build the SAME70 bootloader + images
        working-directory: alloy/examples/bootloader_uart
        run: |
          uv run --project ../../tools/alloy alloy build --board same70_xplained --slot bl
          uv run --project ../../tools/alloy alloy emulate --board same70_xplained --emit-only
          out="$PWD/.alloy/build-tree/same70_xplained/out"
          echo "s70_repl=$out/same70_xplained.repl" >> "$GITHUB_ENV"
          echo "s70_bl_elf=$out/bootloader_uart.elf" >> "$GITHUB_ENV"
          # Empty on this board today; present for the same reason as the G0 leg
          # above — the point is that a future shim needs no edit here.
          {
            echo "s70_cs_includes<<CSEOF"
            for cs in "$out"/*.cs; do [ -e "$cs" ] && echo "include @$cs"; done
            echo "CSEOF"
          } >> "$GITHUB_ENV"
          cd ../uart_echo
          uv run --project ../../tools/alloy alloy build --board same70_xplained --slot a
          uv run --project ../../tools/alloy alloy image \
            .alloy/build-tree/same70_xplained/out/uart_echo.elf --set-version 1 -o /tmp/s70_app.img
          slot_a=$(grep -oE 'slot_a_base = 0x[0-9a-f]+' \
            .alloy/generated/same70_xplained/alloy/slots.hpp | grep -oE '0x[0-9a-f]+')
          echo "s70_slot_a=$slot_a" >> "$GITHUB_ENV"
          cd ../ota_app
          uv run --project ../../tools/alloy alloy build --board same70_xplained --slot b
          uv run --project ../../tools/alloy alloy image \
            .alloy/build-tree/same70_xplained/out/ota_app.elf --set-version 2 -o /tmp/s70_good.img
      - name: run the SAME70 bootloader oracle + good-only wire lifecycle
        working-directory: alloy
        run: |
          cat > /tmp/s70_full.resc <<EOF
          using sysbus
          mach create "s70A"
          $s70_cs_includes
          machine LoadPlatformDescription @$s70_repl
          sysbus LoadELF @$s70_bl_elf
          sysbus LoadBinary @/tmp/s70_app.img $s70_slot_a
          EOF
          cat > /tmp/s70_empty.resc <<EOF
          using sysbus
          mach create "s70E"
          $s70_cs_includes
          machine LoadPlatformDescription @$s70_repl
          sysbus LoadELF @$s70_bl_elf
          EOF
          renode-test \
            --variable RESC_FULL:/tmp/s70_full.resc \
            --variable RESC_EMPTY:/tmp/s70_empty.resc \
            --variable UART:sysbus.usart1 \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/bootloader_boots.robot"
          cat > /tmp/s70_wire.resc <<EOF
          using sysbus
          mach create "upd"
          $s70_cs_includes
          machine LoadPlatformDescription @$s70_repl
          macro reset
          """
              sysbus LoadELF @$s70_bl_elf
          """
          runMacro \$reset
          emulation CreateServerSocketTerminal 3457 "term" false
          connector Connect sysbus.usart1 term
          start
          EOF
          nohup renode --disable-xwt -P 12350 -e "include @/tmp/s70_wire.resc" \
            > /tmp/renode_s70.log 2>&1 < /dev/null &
          sleep 8
          uv run --project tools/alloy python scripts/update_e2e.py \
            /tmp/s70_good.img /tmp/s70_good.img 3457 12350 --good-only \
            || { tail -30 /tmp/renode_s70.log; exit 1; }
      # The FULL LIFECYCLE over the wire: Renode runs the real bootloader (blank
      # flash) with its UART on a TCP socket and its monitor as the "power
      # button". scripts/update_e2e.py then drives, through the REAL `alloy
      # update` client: install good app -> trial boot -> the app confirm()s ->
      # confirm persists across a power cycle -> a REPLAYED OLDER image is
      # refused (ota_error 11) and the device keeps running -> bad update (never
      # confirms) -> three exhausted trial boots -> AUTOMATIC ROLLBACK.
      # The downgrade leg and the bad-update leg are each other's control: the
      # same device refuses version 0 and accepts version 2 in one run.
      # Transport, updater, flash driver, verify, the power-atomic boot_store,
      # the trial/confirm machine and the Cortex-M reset/jump — all production.
      - name: full-wire update lifecycle (trial/confirm/rollback)
        working-directory: alloy
        run: |
          cat > /tmp/wire.resc <<EOF
          using sysbus
          mach create "upd"
          $cs_includes
          machine LoadPlatformDescription @$repl
          macro reset
          """
              sysbus LoadELF @$bl_elf
          """
          runMacro \$reset
          emulation CreateServerSocketTerminal 3456 "term" false
          connector Connect sysbus.usart2 term
          start
          EOF
          nohup renode --disable-xwt -P 12349 -e "include @/tmp/wire.resc" \
            > /tmp/renode_wire.log 2>&1 < /dev/null &
          sleep 8
          uv run --project tools/alloy python scripts/update_e2e.py /tmp/good.img /tmp/bad.img \
            --replay=/tmp/old.img \
            || { tail -30 /tmp/renode_wire.log; exit 1; }

      # The anti-rollback floor after an AUTOMATIC ROLLBACK. Its own leg because
      # it is the one path the lifecycle above cannot reach: after a failed trial
      # the device is running the OLD version again, so running_version alone
      # would drop the floor and re-accept a replayed middle version. What keeps
      # it up is the bootloader raising the floor from the slot it is about to
      # overwrite — a single line that the adversarial review of #47 found had no
      # test at all, and which this leg fails within seconds if it is removed.
      - name: anti-rollback floor survives a rollback
        working-directory: alloy
        run: |
          # /tmp/app.bin = uart_echo linked for slot A (it never confirms — the
          # "bad" app); /tmp/good.bin = ota_app linked for slot B. Both were built
          # by earlier steps in this job; only the versions are new here.
          uv run --project tools/alloy alloy image /tmp/app.bin \
            --set-version 5 -o /tmp/v5_a.img
          uv run --project tools/alloy alloy image /tmp/good.bin \
            --set-version 3 -o /tmp/v3_b.img
          pkill -f "renode.*12349" || true
          sleep 2
          nohup renode --disable-xwt -P 12349 -e "include @/tmp/wire.resc" \
            > /tmp/renode_floor.log 2>&1 < /dev/null &
          sleep 8
          uv run --project tools/alloy python scripts/rollback_floor_e2e.py \
            /tmp/good.img /tmp/v5_a.img /tmp/v3_b.img \
            || { tail -30 /tmp/renode_floor.log; exit 1; }

      # LAST in this job ON PURPOSE: it rebuilds the bootloader IN PLACE with a
      # key baked in, so any step that expects the unsigned artifact must run
      # before it. (CI caught exactly that — the signed bootloader correctly
      # refused the unsigned lifecycle images with ota_error 10.)
      # SIGNED IMAGES (the update root of trust). A keypair is generated HERE —
      # no signing key is ever committed — the bootloader is rebuilt with the
      # public half baked in, and three machines prove the security claim:
      # correctly-signed boots; a TAMPERED payload with BOTH CRCs repaired is
      # refused (only the signature can catch it); an image signed by a DIFFERENT
      # key is refused. Both refusals must land in update mode, not a jump.
      - name: build a signed bootloader + signed/tampered/wrong-key images
        working-directory: alloy/examples/bootloader_uart
        run: |
          uv run --project ../../tools/alloy alloy keygen -o /tmp/update_key --force
          uv run --project ../../tools/alloy alloy keygen -o /tmp/attacker_key --force
          cp /tmp/update_key.pub .
          printf '\n[ota]\npublic_key = "update_key.pub"\n' >> alloy.toml
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot bl
          uv run --project ../../tools/alloy alloy emulate --board nucleo_g071rb --emit-only
          out="$PWD/.alloy/build-tree/nucleo_g071rb/out"
          # COPY the artifacts out: the rotation step below rebuilds the same
          # example in the same tree, so the in-tree ELF would be overwritten and
          # both oracles would silently run the same bootloader.
          cp "$out/nucleo_g071rb.repl" /tmp/sg.repl
          cp "$out/bootloader_uart.elf" /tmp/sg_bl.elf
          echo "sg_repl=/tmp/sg.repl" >> "$GITHUB_ENV"
          echo "sg_bl_elf=/tmp/sg_bl.elf" >> "$GITHUB_ENV"
          # The C# shims the platform names travel WITH the copy — see the first
          # bootloader leg for why these are discovered rather than named.
          cp "$out"/*.cs /tmp/ 2>/dev/null || true
          {
            echo "sg_cs_includes<<CSEOF"
            for cs in "$out"/*.cs; do
              [ -e "$cs" ] && echo "include @/tmp/$(basename "$cs")"
            done
            echo "CSEOF"
          } >> "$GITHUB_ENV"
          slot_a=$(grep -oE 'slot_a_base = 0x[0-9a-f]+' \
            .alloy/generated/nucleo_g071rb/alloy/slots.hpp | grep -oE '0x[0-9a-f]+')
          echo "sg_slot_a=$slot_a" >> "$GITHUB_ENV"
          # restore the committed example (no key, no [ota]) for later steps
          git checkout alloy.toml && rm -f update_key.pub
          cd ../uart_echo
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot a
          elf=.alloy/build-tree/nucleo_g071rb/out/uart_echo.elf
          uv run --project ../../tools/alloy alloy image "$elf" --set-version 1 \
            --sign /tmp/update_key -o /tmp/sg_signed.img
          uv run --project ../../tools/alloy alloy image "$elf" --set-version 9 \
            --sign /tmp/attacker_key -o /tmp/sg_wrongkey.img
          python3 - <<'PYEOF'
          import pathlib, struct, zlib
          d = bytearray(pathlib.Path("/tmp/sg_signed.img").read_bytes())
          d[0x300] ^= 0x01                      # flip a byte of the app
          struct.pack_into("<I", d, 16, zlib.crc32(bytes(d[32:len(d) - 64])))
          struct.pack_into("<I", d, 28, zlib.crc32(bytes(d[:28])))   # repair BOTH CRCs
          pathlib.Path("/tmp/sg_tampered.img").write_bytes(bytes(d))
          PYEOF
      # KEY ROTATION / REVOCATION. Same bootloader source, a different trusted
      # RING: ["retired", rotate_key.pub] — the state a fleet is in the day after
      # update_key leaks. The ring is positional, so retiring key 0 by zeroing it
      # (never by deleting the entry) keeps every image's --key-id meaning what it
      # meant. Note /tmp/sg_signed.img is REUSED as the retired-key case: the
      # exact same file that boots on the single-key bootloader above must be
      # refused here, which is the whole revocation claim.
      - name: build a ROTATED-ring bootloader + rotation images
        working-directory: alloy/examples/bootloader_uart
        run: |
          uv run --project ../../tools/alloy alloy keygen -o /tmp/rotate_key --force
          cp /tmp/rotate_key.pub .
          printf '\n[ota]\npublic_keys = ["retired", "rotate_key.pub"]\n' >> alloy.toml
          uv run --project ../../tools/alloy alloy build --board nucleo_g071rb --slot bl
          out="$PWD/.alloy/build-tree/nucleo_g071rb/out"
          cp "$out/bootloader_uart.elf" /tmp/rot_bl.elf
          echo "rot_bl_elf=/tmp/rot_bl.elf" >> "$GITHUB_ENV"
          # the ring really is what we said it is — a generated header that
          # quietly fell back to one key would make cases 5/6 pass for free
          grep -q 'key_count = 2' .alloy/generated/nucleo_g071rb/alloy/ota_key.hpp
          grep -q 'RETIRED' .alloy/generated/nucleo_g071rb/alloy/ota_key.hpp
          # restore the committed example (no key, no [ota])
          git checkout alloy.toml && rm -f rotate_key.pub
          cd ../uart_echo
          elf=.alloy/build-tree/nucleo_g071rb/out/uart_echo.elf
          uv run --project ../../tools/alloy alloy image "$elf" --set-version 1 \
            --sign /tmp/rotate_key --key-id 1 -o /tmp/sg_rotated.img
          # signed by the RETIRED key but naming the LIVE one: key_id selects,
          # it must never bypass
          uv run --project ../../tools/alloy alloy image "$elf" --set-version 1 \
            --sign /tmp/update_key --key-id 1 -o /tmp/sg_keyidlie.img
      - name: run the signed-image + key-rotation oracle
        run: |
          for k in signed tampered wrongkey; do
            cat > /tmp/sg_$k.resc <<EOF
          using sysbus
          mach create "sg$k"
          $sg_cs_includes
          machine LoadPlatformDescription @$sg_repl
          sysbus LoadELF @$sg_bl_elf
          sysbus LoadBinary @/tmp/sg_$k.img $sg_slot_a
          EOF
          done
          # the ROTATED-ring bootloader, three images: the new key boots, the
          # retired key (the very file that boots above) does not, and a lie
          # about key_id does not either.
          for k in rotated:sg_rotated retired:sg_signed keyidlie:sg_keyidlie; do
            name="${k%%:*}"; img="${k##*:}"
            cat > /tmp/rot_$name.resc <<EOF
          using sysbus
          mach create "rot$name"
          $sg_cs_includes
          machine LoadPlatformDescription @$sg_repl
          sysbus LoadELF @$rot_bl_elf
          sysbus LoadBinary @/tmp/$img.img $sg_slot_a
          EOF
          done
          renode-test \
            --variable RESC_SIGNED:/tmp/sg_signed.resc \
            --variable RESC_TAMPERED:/tmp/sg_tampered.resc \
            --variable RESC_WRONGKEY:/tmp/sg_wrongkey.resc \
            --variable RESC_ROTATED:/tmp/rot_rotated.resc \
            --variable RESC_RETIRED:/tmp/rot_retired.resc \
            --variable RESC_KEYIDLIE:/tmp/rot_keyidlie.resc \
            --variable UART:sysbus.usart2 \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/signed_boot.robot"
  build:
    # One job per BOARD, looping the examples, instead of a board x example
    # matrix. Not style: 8 boards x 35 examples = 280 matrix jobs, and GitHub
    # Actions silently materializes ZERO jobs past its 256-per-matrix limit —
    # the run goes red with every visible job green, and the entire build
    # coverage vanishes without a single failing job to read. (Exactly that
    # happened on the first push past the limit.) The loop scales with the
    # example list forever, pays toolchain setup 8x instead of 280x, and still
    # names every failing example — all of them, not just the first.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [nucleo_g071rb, nucleo_g0b1re, nucleo_f722ze, same70_xplained, rp2040_zero, raspberry_pi_pico, esp_wrover_kit, esp32_devkit]
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: cache xtensa toolchain
        if: startsWith(matrix.board, 'esp')
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: ~/.alloy/tools/xtensa-esp-elf
          key: xtensa-esp-elf-16.1.0_20260609-linux-x86_64
      - name: install xtensa toolchain
        if: startsWith(matrix.board, 'esp') && steps.xtensa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.alloy/tools && cd ~/.alloy/tools
          curl -sL -o x.tar.xz "https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.xz"
          tar xf x.tar.xz && rm x.tar.xz
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build every example for ${{ matrix.board }}
        run: |
          set -u
          failed=()
          for ex in blink async_blink async_heartbeat async_sensor async_io uart_echo hello pwm_fade encoder analog_probe adc_watchdog i2c_scan i2c_read spi_loopback spi_read adc_read adc_stream dma_uart memory_probe time_probe modbus_rtu_client modbus_rtu_server bus_bridge irq_echo pin_irq dma_probe net_probe net_echo services watchdog window_watchdog nvm rtc dac can gpio_bus fastcode filter secure fs lpuart_wake bridge device_id tick; do
            echo "::group::$ex"
            if ! (cd "alloy/examples/$ex" && uv run --project ../../tools/alloy alloy build --board ${{ matrix.board }}); then
              failed+=("$ex")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "FAILED examples for ${{ matrix.board }}: ${failed[*]}"
            exit 1
          fi

      # ALLOY_FASTCODE claims a hot function runs from RAM. `size` cannot
      # confirm that — the totals are identical whether the section was placed
      # and copied or merely declared. So look at the symbol.
      #
      # This exists because a firmware estate we studied placed sixteen hot
      # functions in a tightly-coupled-memory section that no startup ever
      # copied. Every number looked right for the life of the product; the fast
      # path ran from flash. One `nm` would have shown it.
      - name: fastcode really lands in RAM (${{ matrix.board }})
        run: |
          set -eu
          cd alloy/examples/fastcode
          uv run --project ../../tools/alloy alloy symbols --board ${{ matrix.board }} \
            --section .fastcode --json > /tmp/syms.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/syms.json"))
          fast = next((s for s in d["sections"] if s["name"] == ".fastcode"), None)
          if fast is None or not fast["size"]:
              sys.exit("FAIL: .fastcode is absent or empty — nothing was placed there")
          if not fast["needs_copy"]:
              sys.exit(f"FAIL: .fastcode runs at {fast['vma']:#x} and is stored at "
                       f"{fast['lma']:#x} — same address, so it is NOT in fast RAM")
          placed = [s for s in d["symbols"] if s.get("section") == ".fastcode" and s["size"]]
          if not placed:
              sys.exit("FAIL: .fastcode has size but holds no sized symbol")
          for s in placed:
              print(f"ok: {s['name']} at {s['addr']:#x} in .fastcode "
                    f"(loaded from {fast['lma']:#x})")
          # And the budget in the example's alloy.toml was evaluated, not skipped.
          if not d["budget"]:
              sys.exit("FAIL: examples/fastcode declares [budget] but none was checked")
          for row in d["budget"]:
              if not row["ok"]:
                  sys.exit(f"FAIL: budget {row['section']}: {row['reason']}")
              print(f"ok: budget {row['section']} {row['used']}/{row['limit']} B")
          PY

  # The net examples pull in vendored lwIP, whose build seam only compiles for a
  # board with an Ethernet MAC — so they CANNOT ride the board×example matrix above
  # (it would try to build them for every board and fail on the ones without eth,
  # where lwIP is never put on the include path). Build them for the Ethernet
  # boards on their own — across TWO MAC families (Microchip GMAC + STM32 ETH), so
  # the "same main.cpp, new MAC = data + per-IP HAL" claim stays green. Compile
  # coverage; silicon (a real link/lease) is validated separately, and the net
  # stack LOGIC is exercised host-side in the host-tests job (tests/test_net.cpp).
  build-net:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [same70_xplained, nucleo_f767zi]
        example: [tcp_echo, udp_echo, dhcp_echo, http_server]
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build ${{ matrix.example }} for ${{ matrix.board }}
        working-directory: alloy/examples/${{ matrix.example }}
        run: uv run --project ../../tools/alloy alloy build --board ${{ matrix.board }}

  # The PRODUCT dimension: one codebase, many products. Not in the
  # board×example matrix above — products multiply build time, so the sweep
  # rides its own narrow job: product_line (the inverter family, NVM +
  # C-header surface) on two boards × both products, plus product_demo (the
  # concept-checked strategies) on its default board × both products — each
  # gated by `alloy product-validate` (the mirror of board-validate), built
  # with `--product` so each pair gets its own board+product-keyed tree.
  build-products:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: product_line, board: nucleo_g071rb, product: chiller_s }
          - { example: product_line, board: nucleo_g071rb, product: chiller_l }
          - { example: product_line, board: nucleo_f722ze, product: chiller_s }
          - { example: product_line, board: nucleo_f722ze, product: chiller_l }
          - { example: product_demo, board: nucleo_g071rb, product: fan_eco }
          - { example: product_demo, board: nucleo_g071rb, product: pump_pro }
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: validate ${{ matrix.product }}
        working-directory: alloy/examples/${{ matrix.example }}
        run: uv run --project ../../tools/alloy alloy product-validate ${{ matrix.product }}
      - name: build ${{ matrix.example }} as ${{ matrix.product }} for ${{ matrix.board }}
        working-directory: alloy/examples/${{ matrix.example }}
        run: uv run --project ../../tools/alloy alloy build --board ${{ matrix.board }} --product ${{ matrix.product }}

  # The product dimension EXECUTED — one leg per product of the product_demo
  # family, same robot, per-product --variable expectations. The step lines
  # are the assertion that the right STRATEGY CODE ran (v/f is stateless and
  # repeats 4140; the FOC mock carries observer state and prints 450 then
  # 787 — one strategy cannot fake the other), so a stale or wrongly-keyed
  # board+product tree fails here, not just a wrong banner. Both legs plus a
  # negative control (pump_pro's ELF against fan_eco's expected lines fails
  # in ~9 s) ran green/red as expected on a LOCAL arm64 Renode 1.16.1; this
  # CI job mirrors the proven emulate-job steps but was authored without a
  # CI run (pushing is not this change's call to make).
  emulate-products:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: fan_eco
            product_line: "product: fan_eco (family: fan_drive)"
            control_line: "control: v/f scalar"
            step1: "step: 4140"
            step2: "step: 4140"
          - product: pump_pro
            product_line: "product: pump_pro (family: fan_drive)"
            control_line: "control: sensorless foc"
            step1: "step: 450"
            step2: "step: 787"
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: install renode (PINNED v1.16.1 portable)
        run: |
          RENODE_VER=1.16.1
          url="https://github.com/renode/renode/releases/download/v${RENODE_VER}/renode-${RENODE_VER}.linux-portable.tar.gz"
          wget -q "$url" -O renode.tar.gz
          mkdir -p "$HOME/renode" && tar xf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          pip3 install --quiet -r "$HOME/renode/tests/requirements.txt"
      - name: build product_demo as ${{ matrix.product }} + emit Renode platform
        id: emit
        working-directory: alloy/examples/product_demo
        run: |
          out=$(uv run --project ../../tools/alloy alloy emulate --board nucleo_g071rb --product ${{ matrix.product }} --emit-only)
          echo "$out"
          echo "resc=$(echo "$out" | awk '/^script:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "uart=$(echo "$out" | awk '/^uart:/{print $2}')" >> "$GITHUB_OUTPUT"
      - name: boot ${{ matrix.product }} under Renode and assert product + strategy
        run: |
          renode-test \
            --variable RESC:'${{ steps.emit.outputs.resc }}' \
            --variable UART:${{ steps.emit.outputs.uart }} \
            --variable 'PRODUCT_LINE:${{ matrix.product_line }}' \
            --variable 'CONTROL_LINE:${{ matrix.control_line }}' \
            --variable 'STEP1:${{ matrix.step1 }}' \
            --variable 'STEP2:${{ matrix.step2 }}' \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/product_demo.robot"

  # NORTH_STAR guard #8: no feature ships unless CI compiles what it emits —
  # `alloy new` scaffolds must build, out-of-repo, exactly as a user would.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: scaffold and build out-of-repo
        run: |
          cd "$RUNNER_TEMP"
          ALLOY_ROOT="$GITHUB_WORKSPACE/alloy" uv run --project "$GITHUB_WORKSPACE/alloy/tools/alloy" alloy new demo --board nucleo_g071rb
          cd demo
          uv run --project "$GITHUB_WORKSPACE/alloy/tools/alloy" alloy build
      # The APPLICATION TEST STORY, end to end and out-of-repo: `alloy build`
      # above proves the firmware compiles; this proves a company can unit-test
      # its logic without hardware. It scaffolds --with-tests, runs the suite,
      # measures coverage of the app header, and then BREAKS one expectation to
      # prove the suite can go red — a test scaffold that cannot fail is a
      # decoration, and this is the cheapest place to prove it can.
      - name: install gcovr (for the coverage leg)
        run: pip install gcovr
      - name: scaffold with tests, run them, cover them, then break them
        run: |
          set -o pipefail
          alloy="uv run --project $GITHUB_WORKSPACE/alloy/tools/alloy alloy"
          cd "$RUNNER_TEMP"
          ALLOY_ROOT="$GITHUB_WORKSPACE/alloy" $alloy new tested --board nucleo_g071rb --with-tests
          cd tested
          $alloy build
          $alloy test | tee test.log
          grep -q "100% tests passed" test.log
          # Coverage of the app's OWN header, not the framework's runner.
          rm -rf .alloy/host-tests
          $alloy test --coverage | tee cov.log
          grep -q "app.hpp" cov.log
          # The scaffold's tests are meant to cover everything they ship with;
          # an untested branch added to the template should be noticed here.
          grep -q "lines: 100" cov.log
          # NEGATIVE CONTROL — invert one expectation, demand a red run.
          sed -i 's/ALLOY_CHECK(!t.heating());/ALLOY_CHECK(t.heating());/' tests/test_app.cpp
          if $alloy test; then
            echo "NEGATIVE CONTROL FAILED: an inverted expectation still passed"
            exit 1
          fi
          echo "negative control fired: the scaffolded suite can go red"

  # SUPPLY CHAIN. Two claims a buyer checks, each with a gate so it cannot rot.
  #
  # (1) Reproducible: the same source produces the same bytes. The gate builds
  #     an example from TWO different absolute paths and compares sha256 of the
  #     .elf/.bin/.hex — plus a negative control (a mutated .bin must compare
  #     unequal) and a scan proving no absolute host path is embedded at all.
  #     Before -ffile-prefix-map the .bin already matched and the .elf did not;
  #     this leg is what keeps that fixed.
  # (2) `alloy sbom` reports what the build ACTUALLY compiles and links, so the
  #     answer must change with the build seam: the fs example must name
  #     littlefs, the http_server example must name lwIP, and neither may claim
  #     the other. A hand-kept inventory cannot pass this.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja + rsync
        run: sudo apt-get update && sudo apt-get install -y ninja-build rsync
      - name: reproducible — blink built from two different absolute paths
        working-directory: alloy
        run: bash scripts/check_reproducible.sh blink nucleo_g071rb
      - name: reproducible — a littlefs image too (vendored C, not just alloy)
        working-directory: alloy
        run: bash scripts/check_reproducible.sh fs nucleo_g0b1re
      - name: build the two images the SBOM is asserted against
        run: |
          cd alloy/examples/fs
          uv run --project ../../tools/alloy alloy build --board nucleo_g0b1re
          cd ../http_server
          uv run --project ../../tools/alloy alloy build --board nucleo_f767zi
      - name: sbom follows the build seam, and every format parses
        run: |
          cd alloy/examples/fs
          uv run --project ../../tools/alloy alloy sbom --board nucleo_g0b1re --format json > /tmp/fs.json
          cd ../http_server
          uv run --project ../../tools/alloy alloy sbom --board nucleo_f767zi --format json > /tmp/http.json
          uv run --project ../../tools/alloy alloy sbom --board nucleo_f767zi --format spdx > /tmp/http.spdx.json
          uv run --project ../../tools/alloy alloy sbom --board nucleo_f767zi --format cyclonedx > /tmp/http.cdx.json
          uv run --project ../../tools/alloy alloy sbom --board nucleo_f767zi --format notice > /tmp/http.notice
          python3 - <<'PY'
          import json
          fs = {c["name"] for c in json.load(open("/tmp/fs.json"))["components"]}
          http = {c["name"] for c in json.load(open("/tmp/http.json"))["components"]}
          assert "littlefs" in fs, f"fs image does not report littlefs: {fs}"
          assert "lwIP" not in fs, f"fs image wrongly reports lwIP: {fs}"
          assert "lwIP" in http, f"http_server does not report lwIP: {http}"
          assert "littlefs" not in http, f"http_server wrongly reports littlefs: {http}"
          spdx = json.load(open("/tmp/http.spdx.json"))
          assert spdx["spdxVersion"] == "SPDX-2.3"
          assert len({p["SPDXID"] for p in spdx["packages"]}) == len(spdx["packages"])
          cdx = json.load(open("/tmp/http.cdx.json"))
          assert cdx["bomFormat"] == "CycloneDX"
          notice = open("/tmp/http.notice").read()
          assert "lwIP" in notice and "BSD-3-Clause" in notice
          print("sbom: seam-following and all four formats well-formed")
          PY

  # The claims on docs/reference/safety.md, re-derived from linked images on
  # every push — no heap, no exceptions/RTTI, no recursion, a computed stack
  # bound — together with the negative controls that make those checks worth
  # reading (a project that DOES recurse and DOES allocate must be caught, and
  # -fno-exceptions/-fno-rtti must actually refuse `throw`/`typeid`).
  #
  # The second half is the escape hatch (docs/guide/escape-hatch.md): a vendor
  # CMSIS-shaped header included ABOVE alloy's must still compile, and a vendor
  # startup file must still fail the link loudly rather than half-working.
  static-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: no heap, no exceptions, no recursion, bounded stack (+ controls)
        working-directory: alloy
        run: |
          bash scripts/check_static_limits.sh \
            blink nucleo_g071rb \
            async_blink nucleo_g071rb \
            escape_hatch nucleo_g071rb \
            fs nucleo_g0b1re \
            http_server nucleo_f767zi
      - name: escape hatch — a vendor startup file must FAIL the link, loudly
        working-directory: alloy
        run: |
          cp -r examples/escape_hatch /tmp/collide
          rm -rf /tmp/collide/.alloy
          cat > /tmp/collide/src/startup_vendor.c <<'EOF'
          extern int main(void);
          void Reset_Handler(void) { main(); }
          void Default_Handler(void) { for (;;) {} }
          EOF
          cat >> /tmp/collide/alloy.toml <<EOF

          [alloy]
          root = "$PWD"
          EOF
          cd /tmp/collide
          if uv run --project "$GITHUB_WORKSPACE/alloy/tools/alloy" alloy build > /tmp/collide.log 2>&1; then
            echo "FAIL: a vendor startup file linked cleanly next to alloy's"
            exit 1
          fi
          grep -q "multiple definition of \`Reset_Handler'" /tmp/collide.log || {
            echo "FAIL: the link failed, but not with the documented message"; cat /tmp/collide.log; exit 1; }
          echo "ok: vendor startup collides at link time, as documented"
      - name: escape hatch — the app's strong IRQ handler wins over alloy's weak thunk
        working-directory: alloy/examples/escape_hatch
        run: |
          nm .alloy/build-tree/nucleo_g071rb/out/escape_hatch.elf > /tmp/syms.txt
          grep -qE '^[0-9a-f]+ T TIM2_IRQHandler$' /tmp/syms.txt || {
            echo "FAIL: TIM2_IRQHandler is not the app's strong definition"; exit 1; }
          grep -qE '^[0-9a-f]+ W TIM3_IRQHandler$' /tmp/syms.txt || {
            echo "FAIL: TIM3_IRQHandler is no longer a weak thunk"; exit 1; }
          echo "ok: strong app handler wins, untouched lines stay weak"
