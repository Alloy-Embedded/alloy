name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NORTH_STAR guards (no silicon facts in hand-written code, no ifdefs in examples)
        run: ./scripts/check_contract.sh

  # Host unit tests for the portable layers (Tier-1 utilities/services). The
  # SAME suite that can run on silicon, run natively with ASan+UBSan — the
  # -fno-exceptions/-fno-rtti build proves the code compiles as firmware does.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build + run host unit tests
        working-directory: alloy
        run: uv run --project tools/alloy alloy test

  # Unit tests for the host-side Python: the CLI codegen/flash helpers (a
  # wrong-but-valid emitted mask/byte the compile matrix can't catch) and the
  # alloy-devices validator (which must report, not crash, on bad data).
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: run CLI + validator unit tests
        working-directory: alloy
        run: |
          uv run --project tools/alloy python -m pytest tools/alloy/tests ../alloy-devices/tests -q

  # NORTH_STAR guard #7 acceptance test: a wrong pin route must FAIL to compile
  # with a diagnostic that names the pin — the compile-time-error UX can't
  # silently regress into acceptance or an unreadable template dump.
  compile-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: a wrong pin route must fail to compile, naming the pin
        working-directory: alloy
        run: uv run --project tools/alloy python scripts/check_compile_errors.py

  # NORTH_STAR goal #2: adding a chip that reuses known IP versions costs
  # "zero new C++ — only data". That promise is only real if the emitter can
  # consume EVERY shipped chip. The board×example matrix compiles only the
  # handful of chips boards reference, so this runs the chip-level codegen over
  # every chip in the database — an emitter bug on any of the ~400 builder-
  # generated chips (e.g. dereferencing an uncurated stub) fails CI here instead
  # of shipping unconsumable data. Generate-only (no cross-compile) — fast.
  gen-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - name: generate every chip in the database
        working-directory: alloy
        run: uv run --project tools/alloy python scripts/gen_all_chips.py

  # Upgrades guard #9 from "compiles" to "executes" for the boards Renode models.
  # Each matrix leg boots one example on the data-generated platform (alloy
  # emulate) and runs a Robot test that asserts real behaviour on the emulated
  # UART. The platform (.repl) is generated from chip data, so it can't drift
  # from the real target.
  #
  #  - firmware_boots.robot (uart_echo): boots and prints its banner.
  #  - uart_echo_roundtrip.robot (uart_echo): injects a line and asserts the
  #    firmware echoes it back — proves the RX+echo+TX I/O path, not just boot.
  #  - async_runs.robot (async_heartbeat): the coroutine executor SCHEDULES
  #    REPEATEDLY — after the banner it must emit three successive "beat N" lines,
  #    each gated behind a `co_await delay(250ms)`. Proves the async runtime
  #    actually runs on the ISA, not just that it compiled.
  #
  # `experimental: true` legs are continue-on-error: a real signal that doesn't
  # block merges while a new board/behaviour is being confirmed green (the local
  # host is Apple Silicon and the pinned Renode tlib is x86_64, so these were
  # authored without an end-to-end local run). Legs WITHOUT the flag are blocking
  # — the proven path can't regress. Drop `experimental` from a leg once it has a
  # few green runs. Extend the matrix as emit/renode.py's RENODE_CPU / RENODE_UART
  # maps grow to cover more families.
  emulate:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Proven-green, blocking — the reference boot oracle.
          - board: nucleo_f722ze
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          - board: nucleo_g071rb
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
          # Async runtime — green once; experimental until the timeout=30 hardening
          # has a few green runs, then flip to blocking.
          - board: nucleo_f722ze
            example: async_heartbeat
            robot: async_runs.robot
            banner: alloy async_heartbeat ready
            experimental: true
          - board: nucleo_g071rb
            example: async_heartbeat
            robot: async_runs.robot
            banner: alloy async_heartbeat ready
            experimental: true
          # Broader boot coverage: emit-verified locally, boot unproven → experimental.
          # nucleo_g0b1re shares the proven STM32 USART model and boots green.
          # The RP2040 boards (rp2040_zero / raspberry_pi_pico) are DEFERRED: they
          # emit a valid .repl but the minimal CPU+UART platform is not enough for
          # them to boot — the firmware needs XOSC/PLL/clocks/resets (and the boot2
          # stage) modelled before the PL011 UART produces output. Re-add once
          # emit/renode.py grows an RP2040 platform (own effort, not a map tweak).
          - board: nucleo_g0b1re
            example: uart_echo
            robot: firmware_boots.robot
            banner: alloy uart_echo ready
            experimental: true
          # I/O behaviour (echo roundtrip), not just boot — new assertion path.
          - board: nucleo_g071rb
            example: uart_echo
            robot: uart_echo_roundtrip.robot
            banner: alloy uart_echo ready
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: install renode (latest portable)
        run: |
          wget -q https://builds.renode.io/renode-latest.linux-portable.tar.gz
          mkdir -p "$HOME/renode" && tar xf renode-latest.linux-portable.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          # renode-test (Robot framework runner) needs these Python deps
          pip3 install --quiet -r "$HOME/renode/tests/requirements.txt"
      - name: build ${{ matrix.example }} + emit Renode platform
        id: emit
        working-directory: alloy/examples/${{ matrix.example }}
        run: |
          out=$(uv run --project ../../tools/alloy alloy emulate --board ${{ matrix.board }} --emit-only)
          echo "$out"
          echo "resc=$(echo "$out" | awk '/^script:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "uart=$(echo "$out" | awk '/^uart:/{print $2}')" >> "$GITHUB_OUTPUT"
      - name: boot ${{ matrix.example }} under Renode and assert behaviour
        # RESC is absolute so the Robot's `include @RESC` resolves (renode-test
        # resolves it relative to the .robot file, not cwd). On CI the runner
        # path is space-free, so emit/renode.py writes absolute .repl/.elf paths
        # inside the .resc too (nested @-paths resolve relative to cwd here, not
        # the .resc). The bare-name fallback only kicks in for local dirs with
        # spaces, where `alloy emulate` runs Renode from the .resc's own dir.
        run: |
          renode-test \
            --variable RESC:'${{ steps.emit.outputs.resc }}' \
            --variable UART:${{ steps.emit.outputs.uart }} \
            --variable BANNER:'${{ matrix.banner }}' \
            "$GITHUB_WORKSPACE/alloy/tests/emulation/${{ matrix.robot }}"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [nucleo_g071rb, nucleo_g0b1re, nucleo_f722ze, same70_xplained, rp2040_zero, raspberry_pi_pico, esp_wrover_kit, esp32_devkit]
        example: [blink, async_blink, async_heartbeat, async_sensor, uart_echo, hello, pwm_fade, analog_probe, i2c_scan, spi_loopback, memory_probe, irq_echo, dma_probe, net_probe, net_echo, services, watchdog, nvm, rtc, dac, can, gpio_bus, fastcode, filter, secure, fs]
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: cache xtensa toolchain
        if: startsWith(matrix.board, 'esp')
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: ~/.alloy/tools/xtensa-esp-elf
          key: xtensa-esp-elf-16.1.0_20260609-linux-x86_64
      - name: install xtensa toolchain
        if: startsWith(matrix.board, 'esp') && steps.xtensa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.alloy/tools && cd ~/.alloy/tools
          curl -sL -o x.tar.xz "https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.xz"
          tar xf x.tar.xz && rm x.tar.xz
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build ${{ matrix.example }} for ${{ matrix.board }}
        working-directory: alloy/examples/${{ matrix.example }}
        run: uv run --project ../../tools/alloy alloy build --board ${{ matrix.board }}

  # NORTH_STAR guard #8: no feature ships unless CI compiles what it emits —
  # `alloy new` scaffolds must build, out-of-repo, exactly as a user would.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: Alloy-Embedded/alloy-devices
          path: alloy-devices
      - uses: astral-sh/setup-uv@v5
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: scaffold and build out-of-repo
        run: |
          cd "$RUNNER_TEMP"
          ALLOY_ROOT="$GITHUB_WORKSPACE/alloy" uv run --project "$GITHUB_WORKSPACE/alloy/tools/alloy" alloy new demo --board nucleo_g071rb
          cd demo
          uv run --project "$GITHUB_WORKSPACE/alloy/tools/alloy" alloy build
