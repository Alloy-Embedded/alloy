name: docs

on:
  push:
    tags: ['v*']        # a release tag publishes a selectable version + moves `latest`
    branches: [main]    # main keeps a live `dev` version
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

# mike publishes the built site to the gh-pages branch.
permissions:
  contents: write

# Never let two doc deploys race on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # mike needs full history + the gh-pages branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt

      # On a PR, just prove the site builds cleanly (no deploy).
      - name: build (strict)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: configure git for mike
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # A tag vX.Y.Z publishes that version and points `latest` (the default) at it.
      - name: deploy release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      # main publishes an always-current `dev` version (selectable in the dropdown).
      - name: deploy dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mike deploy --push dev
