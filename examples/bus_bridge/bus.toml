# The wire contract for this link. The peer (here, the Renode robot's
# monitor-Python implementation) speaks these exact ids and layouts; a real
# second board would compile from a verbatim copy of this file.
#
# Doctrine (alloy bus validate enforces it): ids are explicit u16, never
# auto-assigned, never reused — a dead id is retired, not deleted. Same id
# means same layout forever; a layout change is a new id.
schema = "alloy.bus.v1"

[messages.ping]
id = 0x0301
version = 1
fields = [
  { name = "token", type = "u32" },
]

[messages.pong]
id = 0x0302
version = 1
fields = [
  { name = "token", type = "u32" },
  { name = "count", type = "u32" },
]

# Telemetry: published on a timer by the device itself, forwarded by the
# same bridge. Nobody asks for it — which is the point. This is what a
# sniffing route looks like, and what `alloy monitor` decodes live.
[messages.status]
id = 0x0303
version = 1
fields = [
  { name = "uptime_s", type = "u32" },
  { name = "served",   type = "u32" },
  { name = "lost",     type = "u32" },
]
