[lib]
name = "modbus"
version = "0.5.0"
description = "Modbus RTU — sans-IO core, blocking client (master) and poll-driven server (slave) over any ByteStream uart"
category = "protocol"
license = "MIT"
homepage = "https://modbus.org/specs.php"

[requires]
# The sans-IO core needs no concept; client and server bind to these. The
# library also DEFINES one (DataModel — the server's register bank contract).
concepts = ["ByteStream"]
alloy = ">=0.1"

[headers]
include = ["include"]
namespace = "alloy::lib"
