# alloy library registry — the curated index `alloy lib` reads.
#
# Seed entries are in-tree (source = "path:libs/<name>"). An external driver in
# its own git repo uses source = "git:https://…@<ref>" with the SAME manifest
# shape — that is the whole point: the ecosystem grows with no change to the
# framework. This file is regenerated from each library's alloy.lib.toml, so the
# index can never drift from the manifests.
schema = "alloy.registry.v1"

[bh1750]
version = "0.1.0"
category = "sensor"
summary = "ROHM BH1750FVI ambient-light sensor (I2C)"
concepts = ["I2cBus", "DelayNs"]
source = "path:libs/bh1750"

[bme280]
version = "0.1.0"
category = "sensor"
summary = "Bosch BME280 temperature + pressure + humidity sensor (I2C)"
concepts = ["I2cBus", "DelayNs"]
source = "path:libs/bme280"

