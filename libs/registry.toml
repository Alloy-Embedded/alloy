# alloy library registry — the curated index `alloy lib` reads.
#
# Seed entries are in-tree (source = "path:libs/<name>"). An external driver in
# its own git repo uses source = "git:https://…@<ref>" with the SAME manifest
# shape — that is the whole point: the ecosystem grows with no change to the
# framework. This file is regenerated from each library's alloy.lib.toml, so the
# index can never drift from the manifests.
schema = "alloy.registry.v1"

[bh1750]
version = "0.1.0"
category = "sensor"
summary = "ROHM BH1750FVI ambient-light sensor (I2C)"
concepts = ["I2cBus", "DelayNs"]
source = "path:libs/bh1750"

[bme280]
version = "0.1.0"
category = "sensor"
summary = "Bosch BME280 temperature + pressure + humidity sensor (I2C)"
concepts = ["I2cBus", "DelayNs"]
source = "path:libs/bme280"

[ds3231]
version = "0.1.0"
category = "rtc"
summary = "Maxim DS3231 high-accuracy real-time clock (I2C)"
concepts = ["I2cBus"]
source = "path:libs/ds3231"

[modbus]
version = "0.3.0"
category = "protocol"
summary = "Modbus RTU — sans-IO core, blocking client (master) and poll-driven server (slave) over any ByteStream uart"
concepts = ["ByteStream"]
source = "path:libs/modbus"

[mpu6050]
version = "0.1.0"
category = "sensor"
summary = "InvenSense MPU-6050 6-axis accel+gyro IMU (I2C)"
concepts = ["I2cBus"]
source = "path:libs/mpu6050"

[sht31]
version = "0.1.0"
category = "sensor"
summary = "Sensirion SHT3x temperature + humidity sensor (I2C)"
concepts = ["I2cBus", "DelayNs"]
source = "path:libs/sht31"

[ssd1306]
version = "0.1.0"
category = "display"
summary = "Solomon Systech SSD1306 128x64 monochrome OLED display (I2C)"
concepts = ["I2cBus"]
source = "path:libs/ssd1306"
