site_name: alloy
site_description: One portable main.cpp for any microcontroller — a from-scratch C++23 embedded framework.
site_url: https://alloy-embedded.github.io/alloy/
repo_url: https://github.com/Alloy-Embedded/alloy
repo_name: Alloy-Embedded/alloy
edit_uri: edit/main/docs/
copyright: Made with the alloy project · docs built with Material for MkDocs

theme:
  name: material
  language: en
  icon:
    logo: material/memory
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Alloy-Embedded/alloy
      name: alloy on GitHub
  status:
    silicon: hardware-validated
    beta: preview

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Get started:
      - getting-started.md
      - guide/portable-code.md
      - guide/boards.md
      - guide/examples.md
  - Guide:
      - guide/peripherals.md
      - guide/async.md
      - guide/libraries.md
      - guide/products.md
      - guide/adding-a-board.md
      - guide/testing.md
      - guide/escape-hatch.md
  - Ship it:
      - guide/emulation.md
      - guide/firmware-update.md
      - guide/security.md
      - guide/crash-reports.md
      - guide/supply-chain.md
  - Tools:
      - guide/cli.md
      - guide/vscode.md
  - Concepts:
      - reference/architecture.md
      - reference/chip-coverage.md
      - reference/peripheral-surface.md
      - reference/error-handling.md
      - reference/stability.md
      - reference/safety.md
